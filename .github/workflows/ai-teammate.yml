name: AI Teammate

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to config (relative to .dmtools/, e.g. agents/story_development.json). Not required when check_accounts_only is true.'
        required: false
      encoded_config:
        description: 'Encoded or JSON Agent Config override'
        required: false
      display_key:
        description: 'Ticket key shown in run naming/logs (set by SM agent)'
        required: false
      concurrency_key:
        description: 'Concurrency group override (set by SM agent)'
        required: false
      input_jql:
        description: 'JQL that selected the ticket (set by SM agent)'
        required: false
      project_key:
        description: 'Jira project key (set by SM agent)'
        required: false
      check_accounts_only:
        description: 'Skip the real pipeline job and just report which Claude account(s) are configured and which one a fresh CLI call actually uses (usage-limit diagnostic)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  ai-teammate-agent:
    if: ${{ inputs.check_accounts_only != true }}
    runs-on: ubuntu-latest
    # smAgent.js already computes a per-ticket concurrency_key (defaulting to the
    # ticket key) and passes it on every dispatch — see concurrencyKey in
    # agents/js/smAgent.js. But this group keyed only on config_file, so every
    # ticket sharing one config (e.g. all Test Cases going through
    # pr_test_automation_review.json) landed in the SAME concurrency group and
    # competed for one slot — GitHub cancels the older queued run in favor of a
    # newer one in the same group, so BNP-25/26/27 review runs could cancel each
    # other out even though they're unrelated tickets. Fall back to config_file
    # only for the rare dispatch that omits concurrency_key.
    concurrency:
      group: ai-teammate-agent-${{ inputs.concurrency_key || inputs.config_file }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install project dependencies
        run: npm ci

      - name: Cache DMTools
        id: cache-dmtools
        uses: actions/cache@v4
        with:
          path: ~/.dmtools
          key: dmtools-release-latest-${{ runner.os }}

      - name: Install DMTools CLI
        if: steps.cache-dmtools.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/epam/dm.ai/releases/latest/download/install.sh | bash

      - name: Add DMTools to PATH
        run: echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Verify DMTools installation
        run: dmtools --version

      - name: Run AI Teammate
        working-directory: .dmtools
        env:
          # Jira
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          # JIRA_AUTH_TYPE intentionally omitted — dmtools 1.7.254 returns 404
          # on every Jira Cloud call when it's set to basic or bearer, even
          # with a curl-verified working token. Leaving it unset works.

          # GitHub auth for branch/commit/PR operations (needs `repo` scope;
          # a PAT, not the default GITHUB_TOKEN — see .dmtools/README.md)
          SOURCE_GITHUB_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SOURCE_GITHUB_WORKSPACE: kejno
          SOURCE_GITHUB_REPOSITORY: bonapp
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

          # Claude Code as the Teammate CLI agent (see .dmtools/agents/scripts/providers/claude.sh)
          AI_AGENT_PROVIDER: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional second Pro/Max account — claude.sh automatically retries
          # the whole job against this token if the first account hits its
          # Claude usage limit mid-run. Leave the secret unset to disable
          # fallback (single-account behavior, unchanged).
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_MODEL: claude-sonnet-4-6
          CLAUDE_CODE_MAX_TURNS: '30'

          DMTOOLS_INTEGRATIONS: 'jira,github,ai,cli,file'
          ENCODED_CONFIG: ${{ inputs.encoded_config }}
        run: |
          echo "Using configuration: ${{ inputs.config_file }}"
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "CI run URL: ${CI_RUN_URL}"

          if [ -n "${ENCODED_CONFIG}" ]; then
            dmtools run "${{ inputs.config_file }}" "${ENCODED_CONFIG}" --ciRunUrl "${CI_RUN_URL}"
          else
            dmtools run "${{ inputs.config_file }}" --ciRunUrl "${CI_RUN_URL}"
          fi

      # The provider CLI's own transcript (the raw claude-code / codemie / copilot
      # output, including anything it printed before writing outputs/*.json) is
      # `tee`-d to .dmtools-logs/cli/agent/*.log — see new_agent_log_file() in
      # agents/scripts/providers/_common.sh — but was never archived, so a run
      # that silently produced no output (no result JSON, no commit) left no way
      # to see what the CLI actually did. Upload it on every outcome so failures
      # are diagnosable after the runner is gone.
      - name: Upload agent CLI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cli-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dmtools/.dmtools-logs/cli/**
          if-no-files-found: ignore
          retention-days: 14

  # Quick usage-limit diagnostic: which Claude account(s) are configured, and
  # which one a fresh CLI call actually lands on right now. Skips the full
  # checkout/DMTools/npm-ci setup the real pipeline job needs — this only
  # needs the Claude Code CLI itself, so it stays fast and cheap to run
  # whenever you want to check account state without waiting on or
  # interfering with a real ticket's pipeline run.
  check-active-account:
    if: ${{ inputs.check_accounts_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Report configured accounts and run a minimal probe call
        working-directory: .dmtools
        env:
          AI_AGENT_PROVIDER: claude-code
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE_CODE_MODEL: claude-sonnet-4-6
          CLAUDE_CODE_MAX_TURNS: '1'
        run: |
          set -u
          echo "=== Configured accounts ==="
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Account 1 (CLAUDE_CODE_OAUTH_TOKEN): configured, ends ...${CLAUDE_CODE_OAUTH_TOKEN: -6}"
          else
            echo "Account 1 (CLAUDE_CODE_OAUTH_TOKEN): NOT SET"
          fi
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN_2:-}" ]; then
            echo "Account 2 (CLAUDE_CODE_OAUTH_TOKEN_2): configured, ends ...${CLAUDE_CODE_OAUTH_TOKEN_2: -6}"
          else
            echo "Account 2 (CLAUDE_CODE_OAUTH_TOKEN_2): not set — fallback disabled"
          fi
          echo ""
          echo "=== Probe call (claude.sh's real fallback logic — trivial prompt, max-turns=1) ==="
          # Reuses run_claude_code as-is: prints "🔑 Claude Code account N/M
          # (token ending ...)" for whichever account actually answers, and
          # will itself fall back to account 2 if account 1 is usage-limited.
          source agents/scripts/providers/_common.sh
          source agents/scripts/providers/claude.sh
          PROMPT_ARG="probe-inline-prompt"
          PROMPT="Reply with exactly one word: pong"
          PROMPT_BYTES=$(printf "%s" "$PROMPT" | wc -c | tr -d ' ')
          PASS_ARGS=()
          probe_exit_code=0
          run_claude_code || probe_exit_code=$?
          echo ""
          if [ "$probe_exit_code" -eq 0 ]; then
            echo "=== Probe succeeded — see the account line above for which token answered ==="
          else
            echo "=== Probe failed (exit ${probe_exit_code}) — see output above for which account(s) hit their usage limit ==="
          fi
          exit "$probe_exit_code"
