name: AI Teammate

# Without this the run list is 840 identically-titled "AI Teammate" rows.
# GitHub's expression syntax has no replace/split, so config_file keeps its
# "agents/*.json" shape here rather than being trimmed to the bare agent name.
run-name: AI Teammate (${{ inputs.config_file }}${{ inputs.display_key && format(' · {0}', inputs.display_key) || '' }})

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to config (relative to .dmtools/, e.g. agents/story_development.json)'
        required: true
      encoded_config:
        description: 'Encoded or JSON Agent Config override'
        required: false
      display_key:
        description: 'Ticket key shown in run naming/logs (set by SM agent)'
        required: false
      concurrency_key:
        description: 'Concurrency group override (set by SM agent)'
        required: false
      input_jql:
        description: 'JQL that selected the ticket (set by SM agent)'
        required: false
      project_key:
        description: 'Jira project key (set by SM agent)'
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  ai-teammate-agent:
    runs-on: ubuntu-latest
    # smAgent.js already computes a per-ticket concurrency_key (defaulting to the
    # ticket key) and passes it on every dispatch — see concurrencyKey in
    # agents/js/smAgent.js. But this group keyed only on config_file, so every
    # ticket sharing one config (e.g. all Test Cases going through
    # pr_test_automation_review.json) landed in the SAME concurrency group and
    # competed for one slot — GitHub cancels the older queued run in favor of a
    # newer one in the same group, so BNP-25/26/27 review runs could cancel each
    # other out even though they're unrelated tickets. Fall back to config_file
    # only for the rare dispatch that omits concurrency_key.
    #
    # EXCEPTION — the codex provider on ChatGPT subscription auth: its
    # refresh token is SINGLE-USE and rotates on every refresh, and the
    # rotated auth.json has to round-trip through ONE repo secret (see the
    # restore/persist steps below). Two jobs holding the same auth.json at
    # once means both refresh it, both write the secret, and whichever loses
    # leaves a dead `refresh_token already used` credential behind — recovery
    # is a manual `codex login`. So under codex, every run serializes into a
    # single repo-wide group regardless of ticket. Keep sm.json's
    # maxTriggeredWorkflows at 1 to match; otherwise the extra dispatches just
    # queue up behind this group anyway.
    concurrency:
      group: ${{ vars.AI_AGENT_PROVIDER == 'codex' && 'ai-teammate-agent-codex-auth' || format('ai-teammate-agent-{0}', inputs.concurrency_key || inputs.config_file) }}
      cancel-in-progress: false

    # apps/api/test/*.e2e-spec.ts bootstraps the real Nest app with a live
    # Prisma/PostgreSQL connection (see apps/api/src/prisma/prisma.service.ts) —
    # it does not mock the database. Without this service, every
    # integration test run (story_test_automation, bug_test_automation,
    # bug_development's TDD reproduction step, and any manual `npm run
    # test:e2e -w apps/api` the agent tries) fails or hangs on a connection
    # that never comes up. Host/port/credentials match
    # apps/api/.env.example's DATABASE_URL default.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bonapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: vars.AI_AGENT_PROVIDER != 'codex'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex CLI
        if: vars.AI_AGENT_PROVIDER == 'codex'
        run: npm install -g @openai/codex

      # ChatGPT subscription auth only (CODEX_AUTH_JSON). With an API key
      # instead, this is a no-op and nothing rotates.
      #
      # CODEX_HOME is pinned to one absolute path and exported for every later
      # step, so the CLI writes its rotated auth.json exactly where "Persist
      # rotated Codex auth" reads it back. A mismatch between these two paths
      # is the classic way to burn a single-use refresh token: the CLI rotates
      # the credential on disk, the persist step re-uploads the STALE copy,
      # and the next run starts with a refresh token that was already spent.
      - name: Restore Codex auth
        if: vars.AI_AGENT_PROVIDER == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${CODEX_AUTH_JSON}" ]; then
            if [ -z "${OPENAI_API_KEY}" ]; then
              echo "::error::Codex authentication is not configured. Set either the CODEX_AUTH_JSON or OPENAI_API_KEY repository secret." >&2
              exit 1
            fi
            echo "::notice::CODEX_AUTH_JSON is not set — falling back to OPENAI_API_KEY auth (no token rotation)."
            exit 0
          fi
          echo "CODEX_HOME=$HOME/.codex" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.codex"
          printf '%s' "${CODEX_AUTH_JSON}" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          # Fingerprint only — never the token itself — so a "did the secret
          # actually rotate?" question is answerable from the run logs.
          echo "Restored auth.json (sha256: $(sha256sum "$HOME/.codex/auth.json" | cut -c1-12)…)"

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Cache DMTools
        id: cache-dmtools
        uses: actions/cache@v4
        with:
          path: ~/.dmtools
          key: dmtools-release-latest-${{ runner.os }}

      - name: Install DMTools CLI
        if: steps.cache-dmtools.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/epam/dm.ai/releases/latest/download/install.sh | bash

      - name: Add DMTools to PATH
        run: echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Verify DMTools installation
        run: dmtools --version

      - name: Run AI Teammate
        working-directory: .dmtools
        env:
          # Jira
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          # JIRA_AUTH_TYPE intentionally omitted — dmtools 1.7.254 returns 404
          # on every Jira Cloud call when it's set to basic or bearer, even
          # with a curl-verified working token. Leaving it unset works.

          # GitHub auth for branch/commit/PR operations (needs `repo` scope;
          # a PAT, not the default GITHUB_TOKEN — see .dmtools/README.md)
          SOURCE_GITHUB_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          SOURCE_GITHUB_WORKSPACE: kejno
          SOURCE_GITHUB_REPOSITORY: bonapp
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}

          # Teammate CLI agent. Switch providers with the repo variable
          # AI_AGENT_PROVIDER (claude-code | codex) — it also drives this
          # job's CLI install, auth round-trip and concurrency group above.
          # Only the selected provider's credentials are read; the other's
          # vars stay unset and its provider function is never called.
          AI_AGENT_PROVIDER: ${{ vars.AI_AGENT_PROVIDER || 'claude-code' }}

          # claude-code (see .dmtools/agents/scripts/providers/claude.sh)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MODEL: claude-sonnet-4-6
          CLAUDE_CODE_MAX_TURNS: '30'

          # codex (see .dmtools/agents/scripts/providers/codex.sh). auth.json
          # is already on disk from "Restore Codex auth" above and CODEX_HOME
          # points at it via $GITHUB_ENV, so CODEX_AUTH_JSON is deliberately
          # NOT re-passed here — re-writing the file at provider start would
          # clobber a token the CLI may have already rotated this run.
          # OPENAI_API_KEY is the no-rotation fallback when the subscription
          # secret is absent.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional override. Empty means: use the model Codex CLI selects
          # for the authenticated ChatGPT account.
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}

          DMTOOLS_INTEGRATIONS: 'jira,github,ai,cli,file'
          ENCODED_CONFIG: ${{ inputs.encoded_config }}
        run: |
          echo "Using configuration: ${{ inputs.config_file }}"
          CI_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "CI run URL: ${CI_RUN_URL}"

          if [ -n "${ENCODED_CONFIG}" ]; then
            dmtools run "${{ inputs.config_file }}" "${ENCODED_CONFIG}" --ciRunUrl "${CI_RUN_URL}"
          else
            dmtools run "${{ inputs.config_file }}" --ciRunUrl "${CI_RUN_URL}"
          fi

      # Codex's refresh token is single-use: the CLI rotates it in place during
      # the run, which invalidates the copy currently held in CODEX_AUTH_JSON.
      # Unless the rotated file is written back to that secret, the NEXT run
      # starts with a spent credential and dies on "refresh_token already
      # used" — recoverable only by running `codex login` locally and pasting
      # a fresh auth.json in by hand.
      #
      # if: always() so a failed/among-other-things agent run still persists
      # the credential. It is NOT a full guarantee: a cancelled or timed-out
      # job can be killed before this step runs at all, which burns the token
      # the same way. That residual risk is inherent to round-tripping a
      # rotating credential through CI on a ChatGPT subscription; the recovery
      # is the manual `codex login` above, and it is why the job serializes
      # into one concurrency group.
      #
      # Needs a fine-grained PAT with Secrets: Read and write scoped to THIS
      # repo — the default GITHUB_TOKEN cannot write secrets, and no
      # `permissions:` value grants that (there is no `secrets: write` scope,
      # despite what plenty of blog posts claim).
      - name: Persist rotated Codex auth
        if: always() && vars.AI_AGENT_PROVIDER == 'codex'
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRETS_ADMIN_PAT }}
          # env.CODEX_HOME is empty unless "Restore Codex auth" set it (i.e.
          # API-key mode, or the job died before that step), in which case the
          # fallback path simply will not exist and this step no-ops below.
          AUTH_FILE: ${{ env.CODEX_HOME || format('{0}/.codex', env.HOME) }}/auth.json
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::CODEX_SECRETS_ADMIN_PAT is not set — the rotated Codex credential cannot be written back. If the CLI refreshed its token this run, the next run will fail with 'refresh_token already used' and will need a manual \`codex login\`."
            exit 0
          fi
          if [ ! -f "${AUTH_FILE}" ]; then
            echo "No auth.json at ${AUTH_FILE} (API-key mode, or the run never reached the CLI) — nothing to persist."
            exit 0
          fi
          # stdin, not --body: auth.json is JSON and would otherwise be
          # subject to shell quoting/expansion on its way through the CLI.
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" < "${AUTH_FILE}"
          echo "Persisted auth.json to CODEX_AUTH_JSON (sha256: $(sha256sum "${AUTH_FILE}" | cut -c1-12)…)"

      # dmtools' Java core treats "the CLI subprocess produced no output" as a
      # soft failure for skipAIProcessing/outputType:none jobs — it writes
      # that into the Jira comment/result but does not propagate
      # run-agent.sh's exit code as a process exception, so "Run AI Teammate"
      # above can report success even when Claude Code never actually did
      # anything (e.g. it hit an Anthropic-side rate/usage limit and exited
      # 1). See .dmtools/README.md, known bug 8. Independently re-check the
      # most recent CLI transcript this run just wrote and fail the job
      # explicitly if it shows a rate-limit/usage-limit signal, so a run that
      # accomplished nothing shows red instead of a misleadingly green one.
      - name: Validate agent CLI execution
        if: always()
        working-directory: .dmtools
        env:
          PROVIDER: ${{ vars.AI_AGENT_PROVIDER || 'claude-code' }}
        run: |
          if [ "${PROVIDER}" = "codex" ]; then
            log_glob='.dmtools-logs/cli/agent/codex-*.log'
            # Codex's own quota wording, plus the failure unique to
            # round-tripping a single-use refresh token through CI: a burned
            # credential makes the CLI exit early having done nothing.
            pattern='usage limit|rate limit|rate_limit|"status":429|429 Too Many Requests|refresh token|refresh_token|invalid_grant|Please run `codex login`'
            hint="The ChatGPT account behind CODEX_AUTH_JSON is either temporarily out of capacity, or its refresh token was invalidated (a run killed before 'Persist rotated Codex auth' burns it). For a quota limit, wait for the reset and re-run. For an auth failure, run \`codex login\` locally and paste the fresh ~/.codex/auth.json into the CODEX_AUTH_JSON secret."
          else
            log_glob='.dmtools-logs/cli/agent/claude-code-*.log'
            pattern='usage limit reached|hit your session limit|"error":"rate_limit"|"api_error_status":429|"status":"rejected"'
            hint="The Claude account behind CLAUDE_CODE_OAUTH_TOKEN is temporarily out of capacity. Wait for the limit to reset (the transcript's 'resets ...' message says when) and re-run."
          fi

          latest_log="$(ls -t ${log_glob} 2>/dev/null | head -1)"
          if [ -z "${latest_log}" ]; then
            echo "::error::No ${PROVIDER} transcript was produced. The agent CLI did not complete a real invocation, so this run must not be treated as successful." >&2
            exit 1
          fi
          if grep -Eqi "${pattern}" "${latest_log}"; then
            echo "::error::${PROVIDER} hit a provider-side rate/usage or auth limit during this run (see ${latest_log} in the agent-cli-logs artifact below) — the job did not accomplish anything real, even though the 'Run AI Teammate' step above may show green. This is not a bug in this repo's code. ${hint} sm-agent.yml's next cycle will also naturally retry this ticket on its own." >&2
            exit 1
          fi
          if [ "${PROVIDER}" = "codex" ]; then
            if grep -Eq '"type":"turn.failed"|"type": "turn.failed"' "${latest_log}"; then
              echo "::error::Codex reported turn.failed (see ${latest_log} in the agent-cli-logs artifact)." >&2
              exit 1
            fi
            if ! grep -Eq '"type":"turn.completed"|"type": "turn.completed"' "${latest_log}"; then
              echo "::error::Codex transcript has no turn.completed event, so the agent invocation cannot be considered successful (see ${latest_log})." >&2
              exit 1
            fi
          fi
          echo "✅ Latest ${PROVIDER} call completed successfully."

      # The provider CLI's own transcript (the raw claude-code / codemie / copilot
      # output, including anything it printed before writing outputs/*.json) is
      # `tee`-d to .dmtools-logs/cli/agent/*.log — see new_agent_log_file() in
      # agents/scripts/providers/_common.sh — but was never archived, so a run
      # that silently produced no output (no result JSON, no commit) left no way
      # to see what the CLI actually did. Upload it on every outcome so failures
      # are diagnosable after the runner is gone.
      - name: Upload agent CLI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cli-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dmtools/.dmtools-logs/cli/**
          if-no-files-found: ignore
          retention-days: 14
